<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#e7e6d7">
  <title>xxx77 — бюджет</title>

  <!-- Шрифты: Prata — цифры денег, Golos Text — интерфейс, JetBrains Mono — служебные строки -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Prata&display=swap">

  <!-- ?v=18 — метка версии: Telegram и браузер кэшируют файлы намертво,
       поменяй число, если правки не видны на телефоне -->
  <link rel="stylesheet" href="style.css?v=18">
  <!-- Скрипт Telegram: даёт приложению доступ к теме, вибрации и кнопкам Telegram.
       В обычном браузере он просто ничего не делает — приложение всё равно работает. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="app">

  <!-- ВЕРХНЯЯ СТРОКА -->
  <header class="topbar">
    <span class="wordmark">xxx77</span>
    <span class="serial" id="serial">№ 000000</span>
    <button class="link-btn" id="btnCategories">Категории</button>
  </header>

  <!-- Микротекст: край «купюры» -->
  <div class="microtext" aria-hidden="true"></div>

  <!-- ПЕРЕКЛЮЧАТЕЛЬ ЭКРАНОВ -->
  <nav class="tabs" role="tablist">
    <button class="tab is-active" role="tab" aria-selected="true"  aria-controls="viewMain"   data-view="main">Счёт</button>
    <button class="tab"           role="tab" aria-selected="false" aria-controls="viewReport" data-view="report">Отчёт</button>
  </nav>

<!-- ================= ЭКРАН «СЧЁТ» ================= -->
<div id="viewMain" role="tabpanel">

  <!-- ГЛАВНОЕ: СКОЛЬКО ДЕНЕГ -->
  <section class="block block-balance">
    <!-- Гильошир: рисуется в app.js, форма зависит от суммы на руках -->
    <div class="guilloche" id="guilloche" aria-hidden="true"></div>

    <p class="field-label">На руках</p>
    <p class="figure" id="balance">0 ₽</p>

    <div class="vault-row">
      <span class="field-label">В банке</span>
      <span class="vault-sum" id="savings">0 ₽</span>
      <button class="quiet-btn" id="btnWithdraw">Снять</button>
    </div>

    <!-- Каждая открывает окно записи — своё для расхода, дохода и банка -->
    <div class="actions">
      <button class="act act-spend"  data-type="expense">Расход</button>
      <button class="act act-earn"   data-type="income">Доход</button>
      <button class="act act-vault"  data-type="save">Банк</button>
    </div>
  </section>

  <!-- ИТОГИ ЗА МЕСЯЦ -->
  <section class="block">
    <p class="section-label" id="monthTitle">Этот месяц</p>

    <dl class="month">
      <div class="month-cell">
        <dt class="field-label">Доходы</dt>
        <dd class="month-sum sum-earn" id="monthIncome">0 ₽</dd>
      </div>
      <div class="month-cell">
        <dt class="field-label">Расходы</dt>
        <dd class="month-sum" id="monthExpense">0 ₽</dd>
      </div>
      <div class="month-cell">
        <dt class="field-label">Отложено</dt>
        <dd class="month-sum sum-vault" id="monthSaved">0 ₽</dd>
      </div>
    </dl>

    <div class="bars" id="byCategory"></div>
  </section>

  <!-- ИСТОРИЯ ОПЕРАЦИЙ -->
  <section class="block block-last">
    <p class="section-label">История</p>
    <div id="list"></div>
  </section>

</div>
<!-- ================= КОНЕЦ ЭКРАНА «СЧЁТ» ================= -->


<!-- ================= ЭКРАН «ОТЧЁТ» ================= -->
<div id="viewReport" role="tabpanel" hidden>

  <!-- ИТОГ ПО ВСЕМ ЗАПИСЯМ -->
  <section class="block">
    <p class="section-label">За всё время</p>

    <dl class="month">
      <div class="month-cell">
        <dt class="field-label">Доходы</dt>
        <dd class="month-sum sum-earn" id="allIncome">0 ₽</dd>
      </div>
      <div class="month-cell">
        <dt class="field-label">Расходы</dt>
        <dd class="month-sum" id="allExpense">0 ₽</dd>
      </div>
      <div class="month-cell">
        <dt class="field-label">В банке</dt>
        <dd class="month-sum sum-vault" id="allSaved">0 ₽</dd>
      </div>
    </dl>

    <p class="report-meta" id="reportMeta"></p>
  </section>

  <!-- ГДЕ ЛЕЖАТ ЗАПИСИ -->
  <section class="block">
    <p class="section-label">Хранение</p>
    <p class="storage-state">
      <span class="storage-dot is-idle" id="storageDot" aria-hidden="true"></span>
      <span id="storageTitle">Проверяю…</span>
    </p>
    <p class="storage-note" id="storageNote"></p>
  </section>

  <!-- МЕСЯЦЫ → ДНИ → ОПЕРАЦИИ -->
  <section class="block block-last">
    <p class="section-label">По месяцам</p>
    <div id="reportList"></div>
  </section>

</div>
<!-- ================= КОНЕЦ ЭКРАНА «ОТЧЁТ» ================= -->

  <div class="microtext" aria-hidden="true"></div>

</div>

<!-- ВСПЛЫВАЮЩЕЕ СООБЩЕНИЕ -->
<div class="toast" id="toast" role="status"></div>

<!-- ОКНО ЗАПИСИ ОПЕРАЦИИ -->
<div class="modal" id="entryModal" hidden>
  <div class="modal-backdrop" data-entry-close></div>
  <div class="sheet">
    <div class="sheet-head">
      <h2 class="sheet-title" id="entryTitle">Расход</h2>
      <button class="link-btn" data-entry-close>Отмена</button>
    </div>

    <div class="amount-row">
      <input id="amount" class="amount-input" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Сумма">
      <span class="amount-cur" aria-hidden="true">₽</span>
    </div>

    <input id="note" class="note-input" placeholder="Комментарий" autocomplete="off" maxlength="60" aria-label="Комментарий">

    <!-- Сюда app.js сам вставит кнопки категорий -->
    <div class="chips" id="chips"></div>

    <button class="act act-wide act-spend" id="entrySubmit">Записать</button>
  </div>
</div>

<!-- ОКНО УПРАВЛЕНИЯ КАТЕГОРИЯМИ -->
<div class="modal" id="catModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="sheet">
    <div class="sheet-head">
      <h2 class="sheet-title">Категории</h2>
      <button class="link-btn" data-close>Готово</button>
    </div>
    <p class="hint">Категорию можно не выбирать — операция сохранится без неё.</p>
    <div class="cat-list" id="catList"></div>
    <div class="cat-add">
      <input id="newCat" class="note-input" placeholder="Новая категория" maxlength="24" autocomplete="off" aria-label="Новая категория">
      <button class="act act-spend act-auto" id="btnAddCat">Добавить</button>
    </div>
  </div>
</div>

<!-- ОКНО ПОДТВЕРЖДЕНИЯ УДАЛЕНИЯ -->
<div class="modal modal-center" id="confirmModal" hidden>
  <div class="modal-backdrop" data-cancel></div>
  <div class="sheet sheet-confirm">
    <h2 class="sheet-title" id="confirmText">Удалить операцию?</h2>
    <div class="confirm-actions">
      <button class="act act-ghost" data-cancel>Отмена</button>
      <button class="act act-danger" id="confirmYes">Удалить</button>
    </div>
  </div>
</div>

<script src="app.js?v=18"></script>
</body>
</html>
